<html>
<head>
    <title>Document</title>
    <style>
        header{
            background-color: rgb(122, 238, 139);
            text-align: center;
            font-size: 20px;
            font-family: cambria;
            padding: 10px;
        }
        body{
            background-color: rgb(5, 88, 6);
            font-family : cambria;
        }
        .container{
            background-color: white;
            width : 500px;
            margin : auto;
            padding : 10px;
            border : none;
            border-radius : 8px;
            box-shadow: 0 0 10px black;
            text-align : center;
        }
        button{
            background-color : lightblue;
            font-size : 18px;
        }
        button:hover {
            background-color: rgb(64, 64, 173);
        }
        input{
            border-radius : 8px;
            font-size : 20px;
            color : grey;
            width : 400px;
            margin : auto;
        }
        #result{
            font
        }
    </style>
</head>
<body>
    <header><h1>SIMPLE INTEREST CALCULATOR</h1></header>

    <div class="container">
        <input type="number" id="principal" placeholder="Enter the principal amount "><br>
        <input type="number" id="rate" placeholder="Enter the rate of interest"><br>
        <input type="number" id="time" placeholder="Enter the time period"><br>
        <button onclick="calculateSI()">Calculate SI</button><br>

        <div id="result"></div>
    </div>
    <script>
        function calculateSI(){
            let p = document.getElementById("principal").value;
            let r = document.getElementById("rate").value;
            let t = document.getElementById("time").value;

            if( p === "" || r === "" || t === ""){
                alert("Please fill all the fields !!!");
                return;
            }

            let si = (p*r*t)/100;
            
            document.getElementById("result").innerHTML = "Simple Interest : " + si ;
        }
    </script>
</body>
</html>
